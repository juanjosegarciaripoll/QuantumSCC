[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QuantumSCC"
version = "0.1.0"
description = "Automated derivation and diagonalization of superconducting circuit Hamiltonians"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "superconducting circuits",
    "quantum",
    "Hamiltonian",
    "Faddeev-Jackiw",
    "circuit quantization",
    "physics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/juanjosegarciaripoll/QuantumSCC"
Repository = "https://github.com/juanjosegarciaripoll/QuantumSCC"
Issues = "https://github.com/juanjosegarciaripoll/QuantumSCC/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/QuantumSCC"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/QuantumSCC",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Static type checking is required for the diagonaliser (solver) component only;
# the rest of the quantisation library is intentionally left untyped for now.
[tool.mypy]
python_version = "3.13"
files = ["src/QuantumSCC/diag"]
strict = true

# scipy ships no type information; treat its symbols as untyped rather than
# failing on the missing stubs. (numpy is typed.)
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
